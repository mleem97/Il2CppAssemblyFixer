name: .NET Build & Release

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*', '*-U*' ]
  pull_request:
    branches: [ "master" ]

env:
  VERSION_BASE: "1.50.3"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      linux_runner: ${{ steps.pick.outputs.linux }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${VERSION_BASE}-U${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Pick runner (self-hosted with hosted fallback)
        id: pick
        env:
          GH_TOKEN: ${{ secrets.SELF_HOSTED_RUNNER_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          lin='["ubuntu-latest"]'

          if [[ -z "$GH_TOKEN" ]]; then
            echo "No SELF_HOSTED_RUNNER_PAT configured — using hosted runner."
          else
            json=$(gh api "repos/$REPO/actions/runners" --paginate 2>/dev/null)
            if [[ -z "$json" ]]; then
              echo "Runner API call failed — using hosted runner."
            else
              has_lin=$(echo "$json" | jq '[.runners[]
                | select(.status=="online" and .busy==false)
                | select(any(.labels[]; .name=="self-hosted"))
                | select(any(.labels[]; (.name|ascii_downcase)=="linux"))
              ] | length')
              [[ "${has_lin:-0}" -gt 0 ]] && lin='["self-hosted","Linux","X64"]'
            fi
          fi

          echo "linux=$lin" >> "$GITHUB_OUTPUT"
          echo "Linux runner: $lin"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        kind: [ exe-win, exe-linux, plugin ]

    runs-on: ${{ fromJSON(needs.prepare.outputs.linux_runner) }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup .NET 6
        if: matrix.kind == 'plugin'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '6.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.kind }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.kind }}-
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore Il2CppAssemblyFixer.sln

      - name: Embed telemetry defaults
        env:
          TELEMETRY_ENDPOINT:  ${{ secrets.TELEMETRY_ENDPOINT  }}
          TELEMETRY_USERNAME:  ${{ secrets.TELEMETRY_USERNAME  }}
          TELEMETRY_API_KEY:   ${{ secrets.TELEMETRY_API_KEY   }}
          TELEMETRY_TENANT_ID: ${{ secrets.TELEMETRY_TENANT_ID }}
        run: python3 scripts/embed_telemetry_defaults.py Shared/TelemetryDefaults.cs

      - name: Publish EXE win-x64
        if: matrix.kind == 'exe-win'
        run: |
          dotnet publish Il2CppAssemblyFixer.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o publish/win-x64

      - name: Publish EXE linux-x64
        if: matrix.kind == 'exe-linux'
        run: |
          dotnet publish Il2CppAssemblyFixer.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=false \
            -o publish/linux-x64

      - name: Publish MelonLoader Plugin
        if: matrix.kind == 'plugin'
        run: |
          dotnet publish MelonPlugin/Il2CppAssemblyFixerPlugin.csproj \
            -c Release \
            --self-contained false \
            -o publish/plugin

      - name: Ensure zip
        run: |
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y zip
          fi

      - name: Prepare bundle
        run: |
          mkdir -p bundle
          cp README_TELEMETRY.md bundle/README.md
          cp fixer_config.json bundle/fixer_config.json

      - name: Package exe-win
        if: matrix.kind == 'exe-win'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p assets staging
          cp publish/win-x64/Il2CppAssemblyFixer.exe staging/
          cp bundle/fixer_config.json staging/
          cp bundle/README.md staging/
          (cd staging && zip -j "../assets/Il2CppAssemblyFixer_${VERSION}_win-x64.zip" *)
          rm -rf staging

      - name: Package exe-linux
        if: matrix.kind == 'exe-linux'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p assets staging
          cp publish/linux-x64/Il2CppAssemblyFixer staging/
          cp bundle/fixer_config.json staging/
          cp bundle/README.md staging/
          (cd staging && zip -j "../assets/Il2CppAssemblyFixer_${VERSION}_linux-x64.zip" *)
          rm -rf staging

      - name: Package plugin
        if: matrix.kind == 'plugin'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p assets staging
          cp publish/plugin/Il2CppAssemblyFixerPlugin.dll staging/
          cp publish/plugin/dnlib.dll staging/
          cp publish/plugin/Mono.Cecil.dll staging/
          cp bundle/fixer_config.json staging/
          cp bundle/README.md staging/
          (cd staging && zip -j "../assets/Il2CppAssemblyFixerPlugin_${VERSION}_MelonLoader.zip" *)
          rm -rf staging

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: assets-${{ matrix.kind }}
          path: assets/*.zip
          if-no-files-found: error

  release:
    needs: [ prepare, build ]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: assets-*
          merge-multiple: true
          path: ./

      - name: Determine previous tag
        id: meta
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          git fetch --tags --force --prune || true

          PREV_TAG=$(git tag --list --sort=-creatordate \
            | grep -v "^${VERSION}$" \
            | head -n 1)

          if [[ -z "$PREV_TAG" ]]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD | head -n 1)
          fi

          DATE_UTC=$(date -u '+%Y-%m-%d')
          TIME_UTC=$(date -u '+%H:%M:%S UTC')

          {
            echo "version=$VERSION"
            echo "prev_tag=$PREV_TAG"
            echo "date=$DATE_UTC"
            echo "time=$TIME_UTC"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          PREV_TAG: ${{ steps.meta.outputs.prev_tag }}
          DATE_UTC: ${{ steps.meta.outputs.date }}
          TIME_UTC: ${{ steps.meta.outputs.time }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          cat > release-notes.md <<EOF
          **Full Changelog**: https://github.com/${REPOSITORY}/compare/${PREV_TAG}...${VERSION}

          (maybe) Fixes #6

          ## Release Notes: Il2CppAssemblyFixer

          ### **Summary of Functions**
          The **Il2CppAssemblyFixer** is designed to resolve issues where MelonLoader fails to correctly generate or load assemblies for Il2Cpp-based games. Its core functions include:

          *   **Dependency Resolution:** Manually bridges the gap when the automatic `Il2CppAssemblyGenerator` fails to fetch the correct Unity dependencies.
          *   **Assembly Repair:** Fixes common "missing method" or "class not found" errors by ensuring the environment is correctly mapped to the game's specific Unity engine version.
          *   **Automated Injection:** Provides a streamlined way to apply fixes without requiring deep manual edits of internal MelonLoader files.

          ---

          ### **Current Status & Future Plans**
          *   **Compatibility:** The current `.exe` remains fully functional. No mandatory update is required at this time unless otherwise specified.
          *   **Roadmap:** I am currently researching ways to implement this logic **automatically** within the MelonLoader workflow to eliminate the need for manual execution in the future.

          ### **Last Tested**
          *   **Date:** PENDING
          *   **Time:** PENDING
          *   **Status:** PENDING

          ---

          > **Note:** If you encounter any issues with the current build, please refer to the [GitHub Issue Tracker](https://github.com/${REPOSITORY}/issues).

          ---
          <sub>Auto-built from commit ${COMMIT_SHA} on ${DATE_UTC} ${TIME_UTC}</sub>
          EOF

          gh release create "$VERSION" ./*.zip \
            --title "$VERSION" \
            --target "$COMMIT_SHA" \
            --notes-file release-notes.md \
            --latest
